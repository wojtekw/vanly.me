name: vanly-uat
x-app: &app
  image: vanly-uat:current
  build:
    context: ../../
    dockerfile: infra/uat/Dockerfile
  network_mode: host
  restart: unless-stopped
  env_file: /opt/vanly-uat/private/runtime.env
  volumes:
    - /opt/vanly-uat/data/uploads:/app/.local/uploads
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: /opt/vanly-uat/private/db.env
    ports: ['127.0.0.1:5432:5432']
    volumes: ['/opt/vanly-uat/data/postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vanly_app -d vanly_uat']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    <<: *app
    command: ['node', 'apps/api/dist/main.js']
    depends_on: {db: {condition: service_healthy}}
  web:
    <<: *app
    command: ['node', 'apps/frontoffice/node_modules/next/dist/bin/next', 'start', 'apps/frontoffice', '--hostname', '127.0.0.1', '--port', '3100']
    depends_on: ['api']
  owner:
    <<: *app
    command: ['node', 'scripts/panel-server.mjs', 'owner', '8182']
    depends_on: ['api']
  admin:
    <<: *app
    command: ['node', 'scripts/panel-server.mjs', 'admin', '8183']
    depends_on: ['api']
  worker:
    <<: *app
    command: ['node', 'infra/uat/worker.mjs']
    volumes:
      - /opt/vanly-uat/data/uploads:/app/.local/uploads
      - /opt/vanly-uat/private/aws-credentials:/run/vanly/aws-credentials:ro
      - /opt/vanly-uat/private/aws-config:/run/vanly/aws-config:ro
    depends_on: ['api']
